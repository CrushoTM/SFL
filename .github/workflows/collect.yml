name: Collect educational forecasts

on:
  workflow_dispatch:
  schedule:
    # Every two hours, offset from the top of the hour to reduce scheduling congestion (UTC).
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: forecast-history-main
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the main branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect new pregame forecasts and final results
        run: python collector.py

      - name: Commit changes to forecast history
        run: |
          if git diff --quiet -- data/history.json; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "data: update pregame forecast history"
          git push origin HEAD:main
